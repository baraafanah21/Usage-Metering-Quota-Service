name: metering

# One value for both the api and the demo (which plays the operator to create accounts).
# Dev-only default so a fresh clone starts; set ADMIN_API_KEY in .env for anything real.
x-admin-api-key: &admin-api-key ${ADMIN_API_KEY:-dev-admin-key-change-me-0123456789abcdef}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering
      POSTGRES_DB: metering
    volumes:
      - db-data:/var/lib/postgresql/data
    # No host port: the api reaches it on the compose network.
    # For a shell: docker compose exec db psql -U metering
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d metering"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://metering:metering@db:5432/metering
      PORT: "3000"
      ADMIN_API_KEY: *admin-api-key
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # The image has no curl; Node 22's fetch does the same job.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Demo client app: http://localhost:8080. Holds DocuCorp's API key; the browser never sees it.
  demo:
    build: ./demo-app
    environment:
      METERING_API_URL: http://api:3000
      ADMIN_API_KEY: *admin-api-key
      PORT: "8080"
      DATA_DIR: /data
    volumes:
      # DocuCorp's API key (shown by the API only once) survives restarts here.
      - demo-data:/data
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    # Healthy once DocuCorp is set up, so `docker compose up --wait` means "ready to demo".
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Separate, disposable database for the test suite:
  #   docker compose --profile test up -d db-test
  db-test:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering
      POSTGRES_DB: metering_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d metering_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
  demo-data:
