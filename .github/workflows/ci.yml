name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metering
          POSTGRES_PASSWORD: metering
          POSTGRES_DB: metering_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metering -d metering_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgres://metering:metering@localhost:5432/metering_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # The whole stack from a clean checkout, as a reviewer would run it, then the demo smoke test.
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-app/package-lock.json

      - name: Typecheck and build demo-app
        working-directory: demo-app
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Start db, api and demo
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Smoke test
        working-directory: demo-app
        run: npm run smoke

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
